<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PLRC 2D - Reactor</title>
<style>
:root{--bg:#05060a;--panel:#0b0e16;--line:#1c2433;--txt:#cfe3ff;--dim:#6b7a96;--accent:#ff7a1a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:ui-monospace,Consolas,monospace;overflow:hidden;touch-action:none}
#app{position:fixed;inset:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#alert{position:absolute;left:0;right:0;top:80px;text-align:center;font-size:clamp(28px,6vw,64px);font-weight:700;letter-spacing:.15em;pointer-events:none;display:none;text-shadow:0 0 24px currentColor}

/* franja superior adaptable */
#top{position:absolute;top:0;left:0;right:0;z-index:6;display:flex;align-items:center;gap:16px;padding:10px 16px;background:rgba(11,14,22,.9);border-bottom:1px solid var(--line)}
#brand{min-width:160px}
h1{margin:0 0 6px;font-size:12px;letter-spacing:.2em;color:var(--dim)}
#status{font-size:11px;padding:5px 10px;border:1px solid var(--line);border-radius:4px;text-align:center;letter-spacing:.08em}
#status.on{color:#7dffb0;border-color:#1f6b45}
#status.melt{color:#ff4d4d;border-color:#7a1010;animation:blink .2s infinite alternate}
@keyframes blink{from{opacity:1}to{opacity:.35}}
#link{font-size:10px;color:var(--dim);margin-top:4px}
#link.ok{color:#7dffb0}
#tempbox{flex:1;min-width:0;text-align:center}
#temp{font-size:32px;font-weight:700;line-height:1.1}
#thermo{height:14px;max-width:720px;margin:6px auto 0;background:#10151f;border:1px solid var(--line);border-radius:3px;overflow:hidden}
#fill{height:100%;width:0;background:linear-gradient(90deg,#4a5bff,#ff3d8b,#ff8a1a,#fff3a0)}
.ticks{display:flex;justify-content:space-between;max-width:720px;margin:3px auto 0;font-size:10px;color:var(--dim)}

/* controles inferiores adaptables */
#bottom{position:absolute;left:0;right:0;bottom:0;padding:12px 16px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.card{background:rgba(11,14,22,.88);border:1px solid var(--line);border-radius:6px;padding:12px;width:min(340px,44vw)}
label{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:6px}
input[type=range]{width:100%;accent-color:var(--accent)}
#ctr{display:flex;gap:10px}
button{flex:1;padding:12px 22px;font:inherit;font-weight:700;letter-spacing:.1em;border-radius:4px;border:1px solid var(--line);background:#121826;color:var(--txt);cursor:pointer}
#ign{border-color:#1f6b45;color:#7dffb0}
#scram{border-color:#7a1010;color:#ff6b6b}

/* Aviso para celulares en vertical */
#orientation-warning{position:fixed;inset:0;background:#05060a;z-index:9999;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
#orientation-warning h2{color:#ffb347;margin-bottom:10px;font-size:22px}
#orientation-warning p{color:#8fb4d8;font-size:14px;line-height:1.5}

/* ADAPTACIÓN AUTOMÁTICA PARA MÓVILES (Pantallas táctiles o resolución pequeña) */
@media (max-width: 900px), (pointer: coarse) {
  #top { padding: 6px 10px; gap: 8px; }
  h1 { font-size: 9px; margin-bottom: 2px; }
  #status { font-size: 9px; padding: 3px 6px; }
  #link { font-size: 8px; }
  #temp { font-size: 22px; }
  #thermo { height: 8px; max-width: 260px; }
  .ticks { display: none; }
  #bottom { padding: 8px 10px; gap: 8px; }
  .card { padding: 8px; width: 30%; }
  label { font-size: 9px; margin-bottom: 3px; }
  input[type=range] { height: 20px; }
  #ctr { width: 34%; gap: 6px; }
  button { padding: 8px 6px; font-size: 10px; letter-spacing: .05em; }
}

/* Forzar aviso si está en vertical en un dispositivo móvil */
@media (max-width: 900px) and (orientation: portrait) {
  #orientation-warning { display: flex; }
}
</style>
</head>
<body>

<div id="orientation-warning">
  <h2>⚠️ Gira tu dispositivo</h2>
  <p>Por favor, coloca tu teléfono en posición <b>horizontal</b> para disfrutar del simulador correctamente.</p>
</div>

<div id="app">
  <canvas id="cv"></canvas>
  <div id="alert"></div>
  <div id="top">
    <div id="brand">
      <h1>PLASMA REACTOR CORE</h1>
      <div id="status">CONECTANDO</div>
      <div id="link">sin conexión</div>
    </div>
    <div id="tempbox">
      <div id="temp">20 °C</div>
      <div id="thermo"><div id="fill"></div></div>
      <div class="ticks"><span>20 °C</span><span>500.000 °C</span></div>
    </div>
    <button id="snd" style="padding:8px 10px; font-size:10px;">🔇 AUDIO</button>
  </div>

  <div id="bottom">
    <div class="card">
      <label><span>REFRIGERANTE</span><span id="coolV">30%</span></label>
      <input id="cool" type="range" min="0" max="100" value="30">
    </div>
    <div id="ctr">
      <button id="ign">IGNICIÓN</button>
      <button id="scram">SCRAM</button>
    </div>
    <div class="card">
      <label><span>INYECCIÓN</span><span id="fuelV">0%</span></label>
      <input id="fuel" type="range" min="0" max="100" value="0">
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let S = { temp: 20, ignited: false, phase: 'NORMAL' };
let meltAudio = null;

// Cargar info de audio meltdown si existe
fetch('/meltdown-info').then(r => r.json()).then(i => {
  if (i.file) {
    meltAudio = new Audio('/meltdown');
    meltAudio.loop = true;
  }
}).catch(()=>{});

$('snd').onclick = () => {
  $('snd').textContent = '🔊 AUDIO ACTIVO';
  if (meltAudio) { meltAudio.play().then(() => meltAudio.pause()).catch(()=>{}); }
};

const es = new EventSource('/events');
es.onopen = () => { $('link').textContent = 'conectado'; $('link').className = 'ok'; };
es.onmessage = (e) => {
  const prevPhase = S.phase;
  S = JSON.parse(e.data);
  
  $('temp').textContent = Math.round(S.temp).toLocaleString('es-AR') + ' °C';
  $('fill').style.width = (Math.log10(Math.max(S.temp, 20) / 20) / Math.log10(25000) * 100) + '%';
  $('status').textContent = S.phase === 'MELTDOWN' ? '¡MELTDOWN!' : (S.ignited ? 'ACTIVO' : 'APAGADO');
  $('status').className = S.phase === 'MELTDOWN' ? 'melt' : (S.ignited ? 'on' : '');
  $('alert').style.display = S.phase === 'MELTDOWN' ? 'block' : 'none';
  $('alert').textContent = '¡MELTDOWN!';
  
  if (S.coolant !== undefined) $('coolV').textContent = Math.round(S.coolant) + '%';
  if (S.fuel !== undefined) $('fuelV').textContent = Math.round(S.fuel) + '%';

  if (meltAudio) {
    if (S.phase === 'MELTDOWN' && prevPhase !== 'MELTDOWN') {
      meltAudio.currentTime = 0;
      meltAudio.play().catch(() => {});
    } else if (S.phase !== 'MELTDOWN' && prevPhase === 'MELTDOWN') {
      meltAudio.pause();
    }
  }
};

$('ign').onclick = () => fetch('/cmd', { method: 'POST', body: JSON.stringify({ type: 'ignite' }) });
$('scram').onclick = () => fetch('/cmd', { method: 'POST', body: JSON.stringify({ type: 'scram' }) });
$('fuel').oninput = (e) => fetch('/cmd', { method: 'POST', body: JSON.stringify({ type: 'set', fuel: Number(e.target.value) }) });
$('cool').oninput = (e) => fetch('/cmd', { method: 'POST', body: JSON.stringify({ type: 'set', coolant: Number(e.target.value) }) });
</script>
</body>
</html>
