<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Salvaguardia · Apagado de emergencia</title>
<style>
:root{--bg:#05070d;--pn:#0b1422;--ln:#1f3552;--tx:#d4e8ff;--ac:#7fb4ff;--ok:#2cff9a;--bad:#ff3b4a;--wa:#ffb020}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px/1.35 system-ui,Segoe UI,sans-serif;overflow:hidden;user-select:none}
#app{display:flex;flex-direction:column;height:100%;padding:8px;gap:8px}
#top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:8px 12px}
#top h1{margin:0;font-size:15px;letter-spacing:.2em;color:var(--ac)}
a,button{font:inherit;color:#a9ddff;text-decoration:none;border:1px solid #294663;background:#0b1727;padding:8px 11px;border-radius:5px;font-size:11px;letter-spacing:.06em;cursor:pointer}
a:hover,button:hover{background:#142b44}
#top .sp{flex:1}#vol{width:90px}
#main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.box{background:var(--pn);border:1px solid var(--ln);border-radius:8px;position:relative;overflow:hidden}
#console{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:10px}
#stat{font-size:12px;letter-spacing:.1em;opacity:.8;text-align:center}
#panel{position:relative;width:min(92%,460px);aspect-ratio:1.5;background:linear-gradient(#1a2434,#0e1623);border:2px solid #34506f;border-radius:12px;box-shadow:inset 0 0 30px #000}
.key{position:absolute;top:50%;transform:translateY(-50%);width:23%;text-align:center}
.key.a{left:3%}.key.b{right:3%}
.slot{width:100%;aspect-ratio:1;border-radius:50%;background:radial-gradient(#0a0f18,#1c2a3e);border:3px solid #3a5878;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.slot svg{width:70%;height:70%;transition:transform .5s}
.key.on .slot{border-color:var(--ok);box-shadow:0 0 14px var(--ok)}
.key.on .slot svg{transform:rotate(90deg)}
.key .lb{margin-top:6px;font-size:10px;letter-spacing:.08em}
.led{display:inline-block;width:8px;height:8px;border-radius:50%;background:#333;margin-right:5px;vertical-align:middle}
.key.on .led{background:var(--ok);box-shadow:0 0 6px var(--ok)}
#well{position:absolute;left:30%;right:30%;top:18%;bottom:18%;background:#0a0f18;border:2px solid #3a5878;border-radius:8px;display:flex;align-items:flex-start;justify-content:center;overflow:hidden}
#lift{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;transform:translateY(62%);transition:transform 1.1s cubic-bezier(.3,1.3,.5,1) 1s}
#pis{width:16%;flex:1;min-height:30px;background:repeating-linear-gradient(#8a98ab 0 6px,#5b6878 6px 8px);border-left:2px solid #333;border-right:2px solid #333;margin-top:-6px}
#pb{position:absolute;bottom:0;left:15%;right:15%;height:14%;background:#2a3444;border:2px solid #4a5c74;border-radius:4px 4px 0 0}
#btn{margin-top:12%;width:72%;aspect-ratio:1;border-radius:50%;background:radial-gradient(#ff7a7a,#b00018 60%,#600);border:4px solid #300;color:#fff;font-weight:800;font-size:10px;letter-spacing:.05em;padding:0;box-shadow:0 5px 0 #400,0 0 18px #f00;cursor:pointer;pointer-events:none}
#btn:active{transform:translateY(4px);box-shadow:0 1px 0 #400,0 0 18px #f00}
.dr{position:absolute;top:0;bottom:0;width:50%;background:linear-gradient(135deg,#ffd04a33,#ffd04a11),repeating-linear-gradient(45deg,#c9a22066 0 10px,#222 10px 20px);border:2px solid #c9a220;display:flex;align-items:center;font-weight:800;font-size:9px;letter-spacing:.06em;color:#ffe08a;text-shadow:0 0 4px #000;transition:transform 1s cubic-bezier(.6,0,.3,1);z-index:2;overflow:hidden;white-space:nowrap}
.dr.l{left:0;border-radius:6px 0 0 6px;justify-content:flex-end;padding-right:4px}.dr.r{right:0;border-radius:0 6px 6px 0;padding-left:4px}
#panel.open .dr.l{transform:translateX(-102%)}#panel.open .dr.r{transform:translateX(102%)}
#panel.open #btn{pointer-events:auto}
#panel.open #lift{transform:translateY(0)}
#panel.busy #btn{pointer-events:none}
#msg{min-height:34px;text-align:center;font-weight:700;letter-spacing:.08em}
#view{display:flex;flex-direction:column}
#cv{flex:1;width:100%;min-height:0;display:block}
#steps{padding:8px 12px;font-size:12px;min-height:58px;border-top:1px solid var(--ln);line-height:1.5}
#ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;font-weight:800;letter-spacing:.2em;font-size:clamp(18px,4vw,32px);background:rgba(0,0,0,.72);padding:16px}
#ov small{display:block;font-size:.45em;letter-spacing:.08em;font-weight:500;margin-top:10px;opacity:.75}
#pad{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:9}
#padbox{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:14px;width:250px;text-align:center}
#dots{font-size:26px;letter-spacing:.3em;min-height:38px;color:var(--ac)}
#keys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
#keys button{padding:12px 0;font-size:15px}
.shake{animation:sh .35s}@keyframes sh{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.flash{animation:fl .5s infinite}@keyframes fl{50%{background:#400}}
@media(max-width:800px){body{overflow:auto}#app{height:auto;min-height:100%}#main{display:flex;flex-direction:column}#view{height:300px;flex:none}}
@media(max-height:480px) and (orientation:landscape){body{overflow:hidden}#app{height:100%;padding:4px;gap:4px}#top{padding:4px 8px}#top h1{font-size:11px}a,button{padding:4px 7px;font-size:9px}#main{display:grid;grid-template-columns:1fr 1fr;gap:4px}#view{height:auto}#msg{min-height:20px;font-size:10px}#stat{display:none}#panel{width:min(88%,300px)}#steps{min-height:34px;font-size:10px;padding:4px 8px}}
</style></head><body>
<div id="app">
 <div id="top"><a href="/">← REACTOR</a><h1>SALVAGUARDIA</h1><span class="sp"></span>
  <button id="mus">♪ MÚSICA: …</button><input id="vol" type="range" min="0" max="100" value="70" title="Volumen"><button id="snd">🔊</button></div>
 <div id="main">
  <div class="box" id="console">
   <div id="stat">SISTEMA DE APAGADO DE EMERGENCIA · INSERTÁ AMBAS LLAVES</div>
   <div id="panel">
    <div class="key a" id="kA"><div class="slot" id="sA"><svg viewBox="0 0 100 100"><circle cx="30" cy="50" r="16" fill="none" stroke="#e8c15a" stroke-width="8"/><rect x="44" y="45" width="46" height="10" fill="#e8c15a"/><rect x="72" y="55" width="8" height="14" fill="#e8c15a"/><rect x="58" y="55" width="8" height="10" fill="#e8c15a"/></svg></div><div class="lb"><span class="led"></span>LLAVE A</div></div>
    <div class="key b" id="kB"><div class="slot" id="sB"><svg viewBox="0 0 100 100"><circle cx="30" cy="50" r="16" fill="none" stroke="#7fd0ff" stroke-width="8"/><rect x="44" y="45" width="46" height="10" fill="#7fd0ff"/><rect x="72" y="55" width="8" height="14" fill="#7fd0ff"/><rect x="58" y="55" width="8" height="10" fill="#7fd0ff"/></svg></div><div class="lb"><span class="led"></span>LLAVE B · CÓDIGO</div></div>
    <div id="well"><div id="pb"></div><div id="lift"><button id="btn">APAGADO<br>EMERGENCIA</button><div id="pis"></div></div><div class="dr l">NO ABRIR</div><div class="dr r">SIN AUTORIZ.</div></div>
   </div>
   <div id="msg"></div>
  </div>
  <div class="box" id="view"><canvas id="cv"></canvas><div id="steps"></div><div id="ov"></div></div>
 </div>
</div>
<div id="pad"><div id="padbox"><div style="letter-spacing:.14em;color:var(--ac)">CÓDIGO DE AUTORIZACIÓN</div><div id="dots"></div>
 <div id="keys"></div><button id="padx" style="margin-top:8px;width:100%">CANCELAR</button></div></div>
<script>
const $=id=>document.getElementById(id);
const CODE='7391';            // código de la llave B
const P_OK=0.65;              // probabilidad de que el apagado funcione
// ---------- estado ----------
let kA=false,kB=false,busy=false,entry='',fails=0,lockUntil=0,mute=false;
function msg(t,c){$('msg').textContent=t;$('msg').style.color=c||'';}
let wasOpen=false;
function refreshKeys(){const op=kA&&kB&&!busy;if(op&&!wasOpen){beep(120,.9,.07,'sawtooth');setTimeout(()=>beep(200,.25,.1,'square'),1000);setTimeout(()=>beep(90,.3,.12,'square'),1500);}wasOpen=op;$('kA').classList.toggle('on',kA);$('kB').classList.toggle('on',kB);
 $('panel').classList.toggle('open',kA&&kB&&!busy);
 $('stat').textContent=kA&&kB?'TAPA LIBERADA · BOTÓN DE APAGADO ACTIVO':'SISTEMA DE APAGADO DE EMERGENCIA · INSERTÁ AMBAS LLAVES';}
$('sA').onclick=()=>{if(busy)return;ensureAudio();kA=!kA;beep(kA?700:400,.1);refreshKeys();};
$('sB').onclick=()=>{if(busy)return;ensureAudio();if(kB){kB=false;beep(400,.1);refreshKeys();return;}
 if(Date.now()<lockUntil){msg('BLOQUEADO · esperá '+Math.ceil((lockUntil-Date.now())/1000)+' s','#ff6b6b');return;}
 entry='';drawDots();$('pad').style.display='flex';};
const kp=$('keys');['1','2','3','4','5','6','7','8','9','←','0','OK'].forEach(k=>{const b=document.createElement('button');b.textContent=k;b.onclick=()=>{ensureAudio();beep(900,.05,.05);
 if(k==='←')entry=entry.slice(0,-1);else if(k==='OK')return check();else if(entry.length<4)entry+=k;drawDots();if(entry.length===4&&k!=='←')setTimeout(check,150);};kp.appendChild(b);});
function drawDots(){$('dots').textContent=entry.replace(/./g,'●')+'○'.repeat(4-entry.length);}
function check(){if(entry.length!==4)return;
 if(entry===CODE){kB=true;fails=0;$('pad').style.display='none';beep(1000,.2);msg('CÓDIGO ACEPTADO','#2cff9a');refreshKeys();}
 else{fails++;beep(200,.4,.1);const pb=$('padbox');pb.classList.remove('shake');void pb.offsetWidth;pb.classList.add('shake');entry='';drawDots();
  if(fails>=3){fails=0;lockUntil=Date.now()+10000;$('pad').style.display='none';msg('3 INTENTOS FALLIDOS · BLOQUEADO 10 s','#ff6b6b');}}}
$('padx').onclick=()=>{$('pad').style.display='none';};
// ---------- audio ----------
let ac=null,master=null,tracks=[],ti=0,el=null,synthNodes=null;
try{ti=+localStorage.getItem('apagadoTrack')||0;}catch(e){}
function ensureAudio(){try{if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=$('vol').value/100;master.connect(ac.destination);}
 if(ac.state==='suspended')ac.resume();}catch(e){}}
$('vol').oninput=e=>{if(master)master.gain.value=e.target.value/100;if(el)el.volume=e.target.value/100;};
$('snd').onclick=()=>{mute=!mute;$('snd').textContent=mute?'🔇':'🔊';if(mute){stopMusic();if(window.speechSynthesis)speechSynthesis.cancel();}};
function beep(f,d,v,type){if(!ac||mute)return;const o=ac.createOscillator(),g=ac.createGain();o.type=type||'square';o.frequency.value=f;g.gain.setValueAtTime(v||.08,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(g);g.connect(master);o.start();o.stop(ac.currentTime+d);}
function names(){return['Sintetizada (incluida)'].concat(tracks.map(t=>t.split('/').pop().replace(/\.[^.]+$/,'')));}
function showTrack(){$('mus').textContent='♪ MÚSICA: '+names()[ti%names().length];}
$('mus').onclick=()=>{ti=(ti+1)%names().length;try{localStorage.setItem('apagadoTrack',ti);}catch(e){}showTrack();if(busy){stopMusic();startMusic();}else{preview();}};
fetch('/apagado-info').then(r=>r.json()).then(j=>{tracks=j.tracks||[];if(ti>=names().length)ti=0;showTrack();}).catch(()=>showTrack());
let prevT=0;function preview(){ensureAudio();stopMusic();startMusic();clearTimeout(prevT);prevT=setTimeout(()=>{if(!busy)stopMusic();},4000);}
function startMusic(fail){if(mute)return;ensureAudio();
 if(ti>0&&tracks[ti-1]){el=new Audio('/apagado?f='+encodeURIComponent(tracks[ti-1]));el.volume=$('vol').value/100;el.play().catch(()=>{});return;}
 // sintetizada: drone que baja de tono + pulso lento
 const o=ac.createOscillator(),o2=ac.createOscillator(),g=ac.createGain(),f=ac.createBiquadFilter(),l=ac.createOscillator(),lg=ac.createGain();
 o.type='sawtooth';o2.type='sine';o.frequency.setValueAtTime(fail?90:110,ac.currentTime);o.frequency.linearRampToValueAtTime(fail?70:45,ac.currentTime+16);o2.frequency.setValueAtTime(220,ac.currentTime);o2.frequency.linearRampToValueAtTime(fail?150:60,ac.currentTime+16);
 f.type='lowpass';f.frequency.value=500;g.gain.value=.16;l.frequency.value=1.2;lg.gain.value=.08;l.connect(lg);lg.connect(g.gain);
 o.connect(f);o2.connect(f);f.connect(g);g.connect(master);o.start();o2.start();l.start();synthNodes=[o,o2,l,g];}
function stopMusic(){if(el){el.pause();el=null;}if(synthNodes){const[g]=[synthNodes[3]];try{g.gain.cancelScheduledValues(ac.currentTime);g.gain.setTargetAtTime(0,ac.currentTime,.3);}catch(e){}const n=synthNodes;setTimeout(()=>n.slice(0,3).forEach(x=>{try{x.stop();}catch(e){}}),1500);synthNodes=null;}}
function say(t){if(mute||!window.speechSynthesis)return;try{const u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=1;u.pitch=.75;u.volume=Math.min(1,$('vol').value/100+.2);speechSynthesis.speak(u);}catch(e){}}
// ---------- secuencia ----------
const OKS=[[0,'Protocolo de apagado de emergencia iniciado.'],[3,'Insertando barras de control.'],[6,'Refrigerante de emergencia al máximo.'],[9,'Contención magnética estabilizando el plasma.'],[12,'Temperatura del núcleo descendiendo.'],[15,'Apagado completado. Núcleo seguro.']];
const BAD=[[0,'Protocolo de apagado de emergencia iniciado.'],[3,'Insertando barras de control.'],[6,'Advertencia. Barras de control atascadas.'],[9,'Error crítico. Apagado fallido.'],[12,'Salvaguardia fuera de servicio. Reintente manualmente.']];
let seq=null,T=0,heat=.05,lastTemp=20,dispT=20;
const fr=v=>Math.max(0,Math.min(1,Math.log10(Math.max(v,20.001)/20)/Math.log10(25000)));
$('btn').onclick=()=>{if(busy)return;ensureAudio();busy=true;const ok=Math.random()<P_OK;seq={ok,t:0,t0:Math.max(20,lastTemp),sent:false,list:ok?OKS:BAD,said:-1,end:ok?17:14};
 refreshKeys();msg('APAGADO EN CURSO…','#ffb020');startMusic(!ok);$('steps').innerHTML='';
};
function finish(){const ok=seq.ok;stopMusic();
 const ov=$('ov');ov.style.display='flex';ov.style.color=ok?'#2cff9a':'#ff3b4a';ov.innerHTML=ok?'NÚCLEO APAGADO<small>El reactor está seguro.</small>':'SALVAGUARDIA FALLÓ<small>El apagado no funcionó. Probá de nuevo.</small>';
 if(!ok){$('view').classList.add('flash');}
 setTimeout(()=>{ov.style.display='none';$('view').classList.remove('flash');seq=null;busy=false;kA=false;kB=false;refreshKeys();msg(ok?'Apagado de emergencia completado.':'Fallo de la salvaguardia. Volvé a insertar las llaves.',ok?'#2cff9a':'#ff6b6b');},4000);}
// ---------- dibujo ----------
const cv=$('cv'),x=cv.getContext('2d');let W=0,H=0;
function rs(){const r=cv.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);W=cv.width=Math.max(1,r.width*d);H=cv.height=Math.max(1,r.height*d);}
new ResizeObserver(rs).observe(cv);addEventListener('resize',rs);rs();
let last=0,sparks=[];
function frame(n){requestAnimationFrame(frame);const dt=Math.min(.1,(n-last)/1000||0);last=n;T+=dt;
 let rods=0,fail=false,alarm=false;
 if(seq){seq.t+=dt;const s=seq;
  while(s.said+1<s.list.length&&s.t>=s.list[s.said+1][0]){s.said++;say(s.list[s.said][1]);$('steps').innerHTML+='▸ '+s.list[s.said][1]+'<br>';$('steps').scrollTop=1e5;if(!s.ok&&s.said>=2){alarm=true;}}
  if(s.ok){rods=Math.min(1,Math.max(0,(s.t-3)/9));
   if(s.t>=9&&!s.sent){s.sent=true;fetch('/cmd',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'salvaguardia'})}).catch(()=>{});}
   const k=Math.max(0,Math.min(1,(s.t-9)/6));dispT=20*Math.pow(s.t0/20,1-k);}
  else{rods=Math.min(.45,Math.max(0,(s.t-3)/9))+(s.t>6?Math.sin(T*30)*.01:0);fail=s.t>6;dispT=Math.min(500000,s.t0*(1+.015*s.t));}
  heat+=((fr(dispT)*.8+.05)-heat)*.1;
  if(!s.ok&&s.t>6&&Math.sin(T*10)>0)beep(600,.12,.05);
  if(s.t>=s.end&&!s.fin){s.fin=true;finish();}}
 else{dispT=lastTemp;heat+=((fr(dispT)*.8+.05)-heat)*.1;}
 x.setTransform(1,0,0,1,0,0);x.fillStyle='#04060b';x.fillRect(0,0,W,H);
 const sc=Math.min(W,H),cx=W/2,cy=H/2,vw=sc*.5,vh=sc*.7,vx=cx-vw/2,vy=cy-vh/2;
 if(fail){x.fillStyle=`rgba(255,0,30,${.1+.1*Math.sin(T*10)})`;x.fillRect(0,0,W,H);}
 x.fillStyle='#101c30';x.strokeStyle='#2c4d78';x.lineWidth=3;rr(vx-8,vy-8,vw+16,vh+16,sc*.06);x.fill();x.stroke();
 const r=Math.min(255,heat*320)|0,gg=Math.max(80,255-heat*190)|0,b=Math.max(40,255-heat*400)|0;
 let g=x.createLinearGradient(0,vy,0,vy+vh);g.addColorStop(0,`rgba(${r},${gg},${b},.55)`);g.addColorStop(1,`rgba(${r*.6|0},${gg*.8|0},${Math.min(255,b+40)},.9)`);x.fillStyle=g;rr(vx,vy,vw,vh,sc*.04);x.fill();
 for(let i=0;i<5;i++){const fx=vx+vw*(.12+i*.19),fw=vw*.07;x.fillStyle=`rgb(${Math.min(255,100+heat*200)|0},${Math.min(255,150+heat*80)|0},${Math.max(120,255-heat*140)|0})`;x.shadowColor=x.fillStyle;x.shadowBlur=sc*.04*heat;rr(fx,vy+vh*.12,fw,vh*.76,fw/2);x.fill();x.shadowBlur=0;
  const len=vh*.1+vh*.72*rods;x.fillStyle='#262e3b';x.fillRect(fx+fw*1.1,vy-sc*.08,fw*.9,len+sc*.08);x.strokeStyle='#55677e';x.lineWidth=1;x.strokeRect(fx+fw*1.1,vy-sc*.08,fw*.9,len+sc*.08);}
 if(fail&&Math.random()<.6)sparks.push({x:vx+Math.random()*vw,y:vy+vh*(.1+.2*Math.random()),vx:(Math.random()-.5)*4,vy:Math.random()*-3,a:1});
 sparks.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.a-=.03;});sparks=sparks.filter(p=>p.a>0);sparks.forEach(p=>{x.fillStyle=`rgba(255,200,80,${p.a})`;x.fillRect(p.x,p.y,3,3);});
 x.fillStyle='#cfe6ff';x.textAlign='center';x.font=Math.max(11,sc*.05)+'px system-ui';x.fillText('TEMP '+Math.round(dispT).toLocaleString('es-AR')+' °C',cx,vy+vh+sc*.07);
}
function rr(a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();}
requestAnimationFrame(frame);
// estado del reactor (se actualiza cada segundo)
function poll(){fetch('/state',{cache:'no-store'}).then(r=>r.json()).then(s=>{if(!busy)lastTemp=s.temp;if(busy||kA||kB)return;
 if(s.phase==='MELTDOWN'){const l=Math.max(0,Math.ceil((s.meltSeconds||130)-s.phaseTime));msg('⚠ MELTDOWN · EXPLOSIÓN EN '+Math.floor(l/60)+':'+String(l%60).padStart(2,'0'),'#ff4d4d');}
 else if(s.phase==='COOLDOWN')msg('Reactor destruido · en reconstrucción','#ffb347');
 else msg('Reactor: '+(s.ignited?'ENCENDIDO · '+Math.round(s.temp).toLocaleString('es-AR')+' °C':'APAGADO'),s.ignited?'#ffb020':'#2cff9a');}).catch(()=>{});}
poll();setInterval(poll,1000);
</script></body></html>
